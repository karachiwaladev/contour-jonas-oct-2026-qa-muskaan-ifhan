<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Todo</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app">
    <h1>Todo</h1>

    <form id="new-task-form" autocomplete="off">
      <input id="new-task" type="text" placeholder="What needs doing?" aria-label="New task">
      <div class="form-row">
        <input id="new-due" type="date" aria-label="Due date (optional)">
        <input id="new-tags" type="text" placeholder="Tags: work, urgent" aria-label="Tags, comma separated (optional)">
        <button type="submit">Add</button>
      </div>
    </form>
    <p id="form-error" class="error" role="alert" hidden>Type a task first.</p>

    <div class="filters" role="toolbar" aria-label="Filter tasks">
      <div class="segmented">
        <button type="button" data-status="all" aria-pressed="true">All</button>
        <button type="button" data-status="active" aria-pressed="false">Active</button>
        <button type="button" data-status="done" aria-pressed="false">Completed</button>
      </div>
      <select id="tag-filter" aria-label="Filter by tag"></select>
      <button id="clear-filters" type="button" class="link" hidden>Clear filters</button>
    </div>

    <ul id="task-list" aria-label="Tasks"></ul>
    <p id="empty-state" class="empty">No tasks yet. Add one above.</p>

    <footer>
      <span id="remaining" aria-live="polite">0 tasks left</span>
      <button id="clear-completed" type="button" disabled>Clear completed</button>
    </footer>
  </main>
  <script src="db.js"></script>
  <script src="app.js"></script>
</body>
</html>
